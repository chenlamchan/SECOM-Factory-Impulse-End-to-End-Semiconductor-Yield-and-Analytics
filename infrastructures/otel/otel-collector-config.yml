# OpenTelemetry Collector Configuration
# Routes metrics to Prometheus

receivers:
  # OTLP receiver for traces and metrics from instrumented apps
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver to scrape the collector's own metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Batch processor: Reduces number of outgoing connections
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter: Prevents OOM crashes
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource detection: Automatically adds cloud/container metadata
  resourcedetection:
    detectors: [env, system, docker]
    timeout: 5s

  # Attributes processor: Enrich spans with custom attributes
  attributes:
    actions:
      - key: environment
        value: production
        action: insert
      - key: project
        value: market-pulse
        action: insert

  spanmetrics:
    metrics_exporter: prometheus
    latency_histogram_buckets: [ 0.01, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0 ]
    dimensions:
      - name: http.method
      - name: http.status_code
    aggregation_temporality: "CUMULATIVE"


exporters:
  # Prometheus exporter: Exposes metrics in Prometheus format
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "market_pulse"
    const_labels:
      collector: "otel"
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

  # Logging exporter: Useful for debugging
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 200

# Extensions: Additional capabilities
extensions:
  health_check:
    endpoint: :13133
  pprof:
    endpoint: :1777
  zpages:
    endpoint: :55679

# Service pipelines: Wire everything together
service:
  extensions: [health_check, pprof, zpages]

  pipelines:

    # Metrics pipeline: App -> Collector -> Prometheus
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus, logging]