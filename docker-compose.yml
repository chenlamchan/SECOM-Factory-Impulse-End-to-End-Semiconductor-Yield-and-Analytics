services:
  # ============================================================================
  # MinIO (S3-Compatible Object Storage / Data Lake)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    secrets:
      - minio_user
      - minio_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password

      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_PROMETHEUS_JOB_ID: "minio"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - prometheus_secrets:/secrets
      - ./infrastructures/minio/init-minio.sh:/init-minio.sh
    entrypoint: /bin/bash
    secrets:
      - minio_user
      - minio_password
    command: /init-minio.sh

  # ==========================================================================
  # OpenTelemetry Collector (The Heart of Modern Observability)
  # ==========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.93.0
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yml" ]
    volumes:
      - ./infrastructures/otel/otel-collector-config.yml:/etc/otel-collector-config.yml
    env_file: .env
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics (collector's own metrics)
      - "8889:8889"   # Prometheus exporter (application metrics)

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:13133/health/status" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================================================
  # Prometheus (Metrics Storage)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./infrastructures/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructures/prometheus/alerts/:/etc/prometheus/alerts/
      - prometheus_data:/prometheus
      - prometheus_secrets:/etc/prometheus/secrets/:ro
    ports:
      - "9090:9090"
    env_file: .env
    secrets:
      - minio_user
      - minio_password
    environment:
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_password
    depends_on:
      otel-collector:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # Grafana (Metrics Visualization)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    secrets:
      - grafana_password
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceToMetrics
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructures/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructures/grafana/dashboards:/var/lib/grafana/dashboards

  # ==========================================================================
  # Postgres (Catalog & Metadata)
  # ==========================================================================
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
      - postgres_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $(cat /run/secrets/postgres_user) -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-init:
    image: postgres:15-alpine
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructures/postgres/postgres-init.sh:/init-postgres.sh
    secrets:
      - postgres_user
      - postgres_password
      - airflow_db_password
    env_file: .env
    entrypoint: ['/bin/sh','/init-postgres.sh']
    environment:
      TARGET_DB: ${POSTGRES_DB}

  # ==========================================================================
  # Nats (As message broker - like AWS SQS)
  # ==========================================================================
  nats:
    image: nats:latest
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js"
    volumes: 
      - nats-data:/data

  # ==========================================================================
  # Synthetic Data Generator
  # ==========================================================================
  generator-engine:
    build:
      context: ./services/synthetic-data-generator
      dockerfile: Dockerfile
    container_name: generator-engine
    env_file: .env
    environment:
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_password
      RAW_DATASET_FILE: /app/data/raw/uci-secom.csv
      DB_PATH: /app/db/simulation_state.db
      
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_started
    secrets:
      - minio_user
      - minio_password
    volumes:
      - generator_data:/app/db
      - ./data/raw/uci-secom.csv:/app/data/raw/uci-secom.csv:ro
    command: python generator_daemon.py

  generator-ui:
    build:
      context: ./services/synthetic-data-generator
      dockerfile: Dockerfile
    container_name: generator-ui
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_password
      RAW_DATASET_FILE: /app/data/raw/uci-secom.csv
      DB_PATH: /app/db/simulation_state.db
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_started
    secrets:
      - minio_user
      - minio_password
    volumes:
      - generator_data:/app/db
      - ./data/raw/uci-secom.csv:/app/data/raw/uci-secom.csv:ro
    command: streamlit run streamlit_app.py --browser.gatherUsageStats false --server.port=8501 --server.address=0.0.0.0

# ============================================================================
# Spark (Processing)
# ============================================================================
  spark-master:
      image: apache/spark:3.5.3-python3
      container_name: spark-master
      command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      ports:
        - "8080:8080"  # Spark UI
        - "7077:7077"  # Spark Master
      volumes:
        - spark_master_data:/opt/spark/data
      healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
        interval: 30s
        timeout: 10s
        retries: 3

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    volumes:
      - spark_worker_data:/opt/spark/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# Orchestration (Apache Airflow)
# ============================================================================
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: airflow-init
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./infrastructures/airflow/airflow-init.sh:/airflow-init.sh:ro
    secrets:
      - airflow_admin_password
      - airflow_db_password
    entrypoint: ['/bin/bash', "/airflow-init.sh"]
    
  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080" # Mapped to 8081 to avoid conflict with Spark UI
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./infrastructures/airflow/airflow-entrypoint.sh:/airflow-entrypoint.sh
    secrets:
      - airflow_db_password
    entrypoint: ["/bin/bash", "/airflow-entrypoint.sh"]
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./infrastructures/airflow/airflow-entrypoint.sh:/airflow-entrypoint.sh
    secrets:
      - airflow_db_password
    entrypoint: ["/bin/bash", "/airflow-entrypoint.sh"]
    command: scheduler

# ============================================================================
# Persistent Volumes
# ============================================================================
volumes:
  minio_data:
  prometheus_data:
  prometheus_secrets:
  grafana_data:
  generator_data:
  nats-data:
  postgres_data:
  spark_master_data:
  spark_worker_data:

# ============================================================================
# Docker Secrets
# ============================================================================
secrets:
  minio_user:
    file: ./secrets/minio_user.txt
  minio_password:
    file: ./secrets/minio_password.txt

  grafana_password:
    file: ./secrets/grafana_password.txt

  postgres_user:
    file: ./secrets/postgres_user.txt
  
  postgres_password:
    file: ./secrets/postgres_password.txt

  airflow_admin_password:
    file: ./secrets/airflow_admin_password.txt
  airflow_db_password:
    file: ./secrets/airflow_db_password.txt
