[tool.poetry]
name = "raw-to-bronze-ingestor"
version = "0.1.0"
description = "This module used to ingest raw parquet file into bronze layer of iceberg, triggered by airflow."
authors = ["ccl"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pyarrow = "23.0.1"
pyiceberg = "0.11.1"
psycopg2-binary = "2.9.11"
sqlalchemy = "2.0.49"
s3fs = "2026.3.0"
pydantic = "2.13.1"
pydantic-settings = "2.13.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
