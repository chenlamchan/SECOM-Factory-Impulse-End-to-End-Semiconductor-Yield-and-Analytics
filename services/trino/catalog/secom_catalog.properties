connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/${ENV:CATALOG_NAME}

iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse
iceberg.jdbc-catalog.catalog-name=secom_catalog

iceberg.jdbc-catalog.connection-user=airflow
iceberg.jdbc-catalog.connection-password=${ENV:AIRFLOW_DB_PASSWORD}

# 2. Add this property to enable the native S3 client
fs.native-s3.enabled=true

# 3. S3 (MinIO) Configuration for the native client
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
s3.region=us-east-1